<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join Dialogue for Space</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7ff;--card:#fff;--line:#d8d9ee;--tx:#141729;--mut:#4a5a7c;--ac:#282b5c;--sun:#48b4d3;--on:#f8f7ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141729;--card:#1c1f45;--line:#323772;--tx:#f8f7ff;--mut:#a3b0cc;--ac:#48b4d3;--sun:#7fd0e6;--on:#141729;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141729;--card:#1c1f45;--line:#323772;--tx:#f8f7ff;--mut:#a3b0cc;--ac:#48b4d3;--sun:#7fd0e6;--on:#141729;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;line-height:1.6}
.limb{height:80px;line-height:0}.limb svg{width:100%;height:80px;display:block}
main{max-width:680px;margin:0 auto;padding:6px 20px 60px}
h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.1}
h1{font-size:clamp(36px,9vw,54px);margin:10px 0 14px}h2{font-size:clamp(28px,6vw,36px);margin:18px 0}
h3{font-size:26px;margin:30px 0 10px}p{margin:0 0 14px}.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px;margin-bottom:10px;font-weight:500;font-size:17px;transition:border-color .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--ac);outline:none;transform:translateX(3px)}
.opt.main{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--mut);font-weight:700;text-decoration:underline}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:3px;background:var(--line);margin-bottom:6px}.bar i{display:block;height:100%;background:var(--sun);transition:width .25s}
.cta{display:inline-block;background:var(--ac);color:var(--on);text-decoration:none;border-radius:12px;padding:13px 22px;font-weight:700;margin-top:10px}
a:focus-visible,.link:focus-visible,.opt:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}.meta b{font-weight:500;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 12px;color:var(--mut)}
ul{padding-left:20px;margin:0 0 14px}li{margin-bottom:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
.card.best{border:2px solid var(--ac)}.card h4{margin:0 0 6px;font-family:'Instrument Serif',serif;font-size:24px;font-weight:400}
.card p{margin:0 0 8px}.fine{font-size:14px;color:var(--mut);margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
label{display:block;font-weight:500;margin-bottom:14px}input,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}input:focus,textarea:focus{outline:2px solid var(--sun);outline-offset:1px}label.chk{display:flex;gap:10px;font-weight:400;font-size:14px}.chk input{width:auto;margin-top:3px}
.brand{max-width:680px;margin:0 auto;padding:16px 20px 0}.brand img{width:64px;height:64px;display:block}
</style>
</head>

<script>
var CONTACT='dialogueforspace@gmail.com';// your email: applications open in the applicant's email app (works without a form service)
var ENDPOINT='https://script.google.com/macros/s/AKfycbzdLcxJahgJnRawy-h6FWdhMe8zgdzx6yAnvYM_B-g1e-sbYAe5tK7QYCE1fezNqbcb/exec';// paste your Google Apps Script web app URL here. If set, applications go to your Google Sheet and email instead
var SCHEDULE='';// optional: a booking link (e.g. Calendly) shown after applying
var DEADLINE='';// optional, e.g. 'Apply before 1 Nov 2026'
var ABOUT="Dialogue for Space is a European non-profit initiative for the next generation, working at the intersection of earth and space. We connect young professionals from across industries with an interest in space and earth systems. Every month we bring early-career professionals together with leading experts, and every day we keep the conversation going in our community. Dialogue for Space bridges the gap between curiosity and expertise, so Europe's next generation stays inspired, informed and connected to the frontier of space. We are open to young professionals and career changers from any background, with a base in the Netherlands and a European outlook.";
var T={
partner:['Partnerships & Funding',["The Partnerships & Funding team is responsible for Dialogue for Space's external relationships and for securing the support that lets the initiative grow.","The team builds relationships with organisations, experts and supporters across the space and earth-systems ecosystem. It identifies where a collaboration could create value for both sides, and turns promising conversations into concrete partnerships, sponsorships and other forms of support.","The team also coordinates external communication, so that organisations hear from Dialogue for Space with one consistent voice."]],
prog:['Programme & Events',["The Programme & Events team creates the experiences at the heart of Dialogue for Space: the monthly dialogue session with a leading expert, and the company cases and site visits that take the community behind the scenes of the sector.","Each event brings 30 to 60 young professionals together in a setting that is welcoming, curious and focused on real conversation. The team decides which topics and experts to feature, plans each event from invitation to follow-up, and keeps improving the format.","Over time the team is also developing new formats, such as meetups between organisations and hybrid sessions open to participants across Europe."]],
comm:['Community & Content',["The Community & Content team makes sure Dialogue for Space is felt every day, not only at events. It tells our story, grows our audience and keeps members connected between sessions.","The team creates content around each dialogue, runs our community channels, welcomes new members and listens to what the community wants. It works closely with Programme & Events and Partnerships & Funding."]],
ops:['Operations & Tech',["The Operations & Tech team builds the foundations that let a volunteer-run initiative work reliably as it grows: the administration, documentation, tools and website that every other team depends on.","The team keeps the organisation's paperwork in order, creates simple processes and templates, and builds the digital tools that make the work of other teams easier."]]};
// t=title, team, lvl (0 member, 1 lead, 2 head), hrs, fn, pil, role[], resp[], fit[]
var R=[
{t:'Head of Partnerships & Funding',team:'partner',lvl:2,hrs:'6-10 hrs/week',fn:['partner'],pil:'net',
role:["As Head of Partnerships & Funding, you will lead the team that builds Dialogue for Space's external network and secures the support needed to grow.","You will set the direction for how we work with organisations, supporters and partners, and make sure every relationship is managed consistently and with care. You will work directly with the founder and shape the yearly partnerships strategy.","This is a role for someone who enjoys building relationships from the ground up and who wants to understand how a young organisation becomes a lasting one."],
resp:["Lead the Partnerships & Funding team and set its yearly priorities.","Develop and refine Dialogue for Space's value proposition for partners and supporters.","Identify, approach and build relationships with organisations that share our mission.","Own strategic external relationships together with the founder.","Oversee proposals, agreements and other external materials.","Set up and maintain a simple system to track contacts, conversations and follow-ups.","Make sure external communication from all teams is coordinated.","Hold regular one-on-ones with team members and report to the founder.","Run the weekly team meeting."],
fit:["Are interested in the space sector, earth observation, sustainability or the broader tech ecosystem.","Enjoy speaking to people and building long-term relationships.","Are proactive and comfortable approaching organisations you have not spoken to before.","Can quickly see where a meaningful collaboration could exist.","Communicate clearly and confidently, in writing and in person.","Have led a team or a project, or are eager to step into that role.","Are comfortable taking ownership without every step being defined.","Previous experience in business development, partnerships, fundraising, consulting or a similar role is helpful, but not required."]},
{t:'Partnerships & Funding Associate',team:'partner',lvl:0,hrs:'3-5 hrs/week',fn:['partner'],pil:'net',
role:["As Partnerships & Funding Associate, you will help build the external side of Dialogue for Space.","Your focus is researching organisations, understanding what they care about and what they could contribute, and helping turn first conversations into concrete collaborations. You will own a small portfolio of external contacts and learn how partnerships are built from scratch.","You will also represent Dialogue for Space at relevant events and report back on opportunities you find."],
resp:["Research organisations, companies and supporters that could collaborate with Dialogue for Space.","Reach out to new contacts together with the Head of Partnerships & Funding.","Write outreach messages, short proposals and partnership materials.","Own a small portfolio of external contacts and keep in regular touch.","Attend relevant events and conferences and share what you learn.","Track relevant news, announcements and developments in the sector.","Keep partners informed about our activities and look for chances to work together.","Participate in the weekly team meeting."],
fit:["Are curious about space, technology and the people shaping the sector.","Enjoy researching organisations and spotting where there is a good fit.","Are comfortable reaching out to people you have never met.","Are structured and can keep track of several conversations at once.","Communicate clearly and professionally.","Enjoy building relationships rather than only sending cold outreach.","Are proactive and follow things through.","Previous experience in partnerships, sales, events or a similar area is useful, but not required."]},
{t:'Head of Programme',team:'prog',lvl:2,hrs:'6-10 hrs/week',fn:['curate'],pil:'dial',
role:["As Head of Programme, you will own what Dialogue for Space talks about and who the community hears from.","You will set the yearly programme across space and earth systems, make sure each monthly dialogue is relevant to a mixed audience of young professionals and career changers, and lead the team that turns the programme into events.","You will also shape where the programme goes next, including new formats such as company cases, site visits and meetups between organisations."],
resp:["Lead the Programme & Events team and set its priorities.","Design the yearly programme of dialogues, company cases and site visits.","Decide which topics, experts and organisations we feature.","Make sure every session is accessible to people from different backgrounds.","Work with Partnerships & Funding on speakers and host organisations.","Work with Community & Content on how each session is shared.","Collect feedback and use it to improve the format.","Hold regular one-on-ones with team members and report to the founder.","Run the weekly Programme & Events meeting."],
fit:["Are curious about space and earth systems and how they connect to other fields.","Know what makes a conversation worth showing up for.","Are comfortable approaching senior experts and representing the initiative.","Think strategically about how events serve a bigger goal.","Have led a team or a project, or are eager to step into that role.","Communicate clearly and give direct, constructive feedback.","Are organised and can balance several initiatives at once.","Previous experience in programming events, organising conferences or leading a student or professional community is helpful, but not required."]},
